<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">CommandLab 界面概览</title>
  <desc id="desc">深色开发者工作台，左侧为 Git 与 Docker 学习路径，右侧为终端预览。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#101823"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#a3ff5f" stop-opacity=".22"/><stop offset="1" stop-color="#a3ff5f" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="30" r="320" fill="url(#glow)"/>
  <rect x="34" y="30" width="1132" height="58" rx="14" fill="#101720" stroke="#263141"/>
  <rect x="54" y="42" width="34" height="34" rx="9" fill="#a3ff5f" fill-opacity=".12" stroke="#a3ff5f" stroke-opacity=".45"/>
  <path d="M64 53l7 6-7 6m10 0h7" fill="none" stroke="#a3ff5f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="100" y="59" fill="#f5f7fb" font-family="system-ui" font-size="16" font-weight="700">CommandLab</text>
  <text x="100" y="76" fill="#8593a6" font-family="system-ui" font-size="9" letter-spacing="2">命令工坊</text>
  <text x="490" y="64" fill="#9aa7b8" font-family="system-ui" font-size="13">学习路径　　学习进度　　在线终端</text>
  <text x="60" y="150" fill="#a3ff5f" font-family="system-ui" font-size="12" font-weight="700" letter-spacing="2">LEARN BY DOING</text>
  <text x="60" y="210" fill="#f5f7fb" font-family="system-ui" font-size="48" font-weight="800">理解命令，而不只是</text>
  <text x="60" y="268" fill="#a3ff5f" font-family="system-ui" font-size="48" font-weight="800">记住命令。</text>
  <text x="60" y="310" fill="#98a5b7" font-family="system-ui" font-size="16">48 节系统课程 · 四级能力路径 · 三平台本机实战</text>
  <rect x="60" y="345" width="164" height="46" rx="12" fill="#a3ff5f"/><text x="97" y="374" fill="#13200a" font-family="system-ui" font-size="14" font-weight="700">开始学习 →</text>
  <rect x="60" y="435" width="250" height="132" rx="18" fill="#111923" stroke="#273342"/>
  <circle cx="92" cy="470" r="17" fill="#f97316" fill-opacity=".14"/><path d="M84 470h16m-4-5l5 5-5 5" fill="none" stroke="#f97316" stroke-width="2"/>
  <text x="82" y="510" fill="#f5f7fb" font-family="system-ui" font-size="19" font-weight="700">Git 版本控制</text><text x="82" y="538" fill="#8593a6" font-family="system-ui" font-size="12">24 节 · 从快照到事故恢复</text>
  <rect x="328" y="435" width="250" height="132" rx="18" fill="#111923" stroke="#273342"/>
  <circle cx="360" cy="470" r="17" fill="#38bdf8" fill-opacity=".14"/><rect x="351" y="462" width="18" height="16" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="350" y="510" fill="#f5f7fb" font-family="system-ui" font-size="19" font-weight="700">Docker 容器化</text><text x="350" y="538" fill="#8593a6" font-family="system-ui" font-size="12">24 节 · 从运行到生产排错</text>
  <rect x="630" y="128" width="510" height="440" rx="20" fill="#080c11" stroke="#283343"/>
  <rect x="630" y="128" width="510" height="46" rx="20" fill="#101720"/><circle cx="656" cy="151" r="5" fill="#fb7185"/><circle cx="674" cy="151" r="5" fill="#fbbf24"/><circle cx="692" cy="151" r="5" fill="#4ade80"/>
  <text x="822" y="155" fill="#748196" font-family="monospace" font-size="10">commandlab-sandbox</text>
  <text x="660" y="220" fill="#a3ff5f" font-family="monospace" font-size="15">$</text><text x="680" y="220" fill="#e4ebf5" font-family="monospace" font-size="15">git status</text>
  <text x="660" y="254" fill="#8491a3" font-family="monospace" font-size="13">On branch feature/learn</text>
  <text x="660" y="282" fill="#8491a3" font-family="monospace" font-size="13">Changes to be committed:</text>
  <text x="680" y="310" fill="#4ade80" font-family="monospace" font-size="13">new file: lesson.mdx</text>
  <text x="660" y="370" fill="#a3ff5f" font-family="monospace" font-size="15">$</text><text x="680" y="370" fill="#e4ebf5" font-family="monospace" font-size="15">docker ps</text>
  <text x="660" y="404" fill="#8491a3" font-family="monospace" font-size="12">CONTAINER ID　 IMAGE　　　 STATUS</text>
  <text x="660" y="432" fill="#38bdf8" font-family="monospace" font-size="12">a1b2c3d4　　 commandlab　 Up 2 minutes</text>
  <rect x="660" y="485" width="450" height="54" rx="10" fill="#111a24" stroke="#283443"/>
  <text x="682" y="518" fill="#9aa8ba" font-family="system-ui" font-size="12">在线沙箱准备中 · 当前使用三平台本机练习</text>
</svg>
